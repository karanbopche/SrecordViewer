[project]
name = "image_dumper"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "argparse-addons==0.12.0",
    "bincopy==20.1.0",
    "humanfriendly==10.0",
    "pillow==10.4.0",
    "pyelftools==0.32",
    "ttkbootstrap==1.14.2",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"


[project.scripts]
image_dumper = "image_dumper:main"
